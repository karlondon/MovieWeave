version: '3.8'

services:
  # FastAPI Backend (NarrativeAI + MovieWeave)
  movieweave-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: movieweave-api
    ports:
      - "8000:8000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - TOONFLOW_URL=http://toonflow:10588
      - DATABASE_TYPE=json
      - JOBS_DB_FILE=/data/jobs_db.json
      - SESSIONS_DB_FILE=/data/sessions_db.json
      - UPLOAD_DIR=/data/uploads
      - OUTPUT_DIR=/data/output
      - TEMP_DIR=/data/temp
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - ./config/.env:/app/.env:ro
    depends_on:
      - toonflow
    networks:
      - movieweave-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Toonflow Animation Engine
  toonflow:
    image: node:18-alpine
    container_name: movieweave-toonflow
    ports:
      - "10588:10588"
    working_dir: /app
    command: >
      sh -c "npm install && npm run dev"
    volumes:
      - ./toonflow:/app
    networks:
      - movieweave-network
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=10588

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: movieweave-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data:/var/www/movieweave/data:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - movieweave-api
    networks:
      - movieweave-network
    restart: unless-stopped

networks:
  movieweave-network:
    driver: bridge

volumes:
  movieweave_data:
    driver: local

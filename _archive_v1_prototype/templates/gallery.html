<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gallery - MovieWeave</title>
    <style>
        body { font-family: Arial, sans-serif; background: #667eea; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 30px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card video { width: 100%; height: 200px; object-fit: cover; }
        .card-info { padding: 15px; }
        .card h3 { color: #667eea; margin-bottom: 5px; }
        .card p { color: #666; font-size: 14px; margin-bottom: 10px; }
        .btn { background: #667eea; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { background: #764ba2; }
        .loading { text-align: center; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Video Gallery</h1>
        <div id="gallery" class="gallery">
            <div class="loading">Loading gallery...</div>
        </div>
    </div>
    
    <script>
        async function loadGallery() {
            try {
                const res = await fetch('/api/characters');
                const data = await res.json();
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = '';
                
                data.characters.slice(0, 5).forEach(char => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <video controls>
                            <source src="/api/video/${char}_happy_demo.mp4" type="video/mp4">
                        </video>
                        <div class="card-info">
                            <h3>${char}</h3>
                            <p>Happy Expression</p>
                            <a href="/generate?char=${char}&expr=happy" class="btn">Create Video</a>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (e) {
                document.getElementById('gallery').innerHTML = '<p style="color:white;">Error loading gallery</p>';
            }
        }
        
        loadGallery();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PDF to Video - MovieWeave</title>
    <style>
        body { font-family: Arial, sans-serif; background: #667eea; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 40px; border-radius: 15px; }
        h1 { color: #667eea; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="file"], select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; }
        button { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 20px; }
        button:hover { background: #764ba2; }
        .alert { padding: 15px; margin: 20px 0; border-radius: 8px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        video { max-width: 100%; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 PDF to Video</h1>
        <div id="alert" class="alert"></div>
        
        <form id="form">
            <div class="form-group">
                <label>Select PDF or TXT File</label>
                <input type="file" id="file" accept=".pdf,.txt" required>
            </div>
            
            <div class="form-group">
                <label>Split By</label>
                <select id="splitBy">
                    <option value="sentences">Sentences</option>
                    <option value="paragraphs">Paragraphs</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Expression</label>
                <select id="expr">
                    <option value="happy">Happy</option>
                    <option value="neutral">Neutral</option>
                    <option value="sad">Sad</option>
                    <option value="angry">Angry</option>
                </select>
            </div>
            
            <button type="submit">Convert to Video</button>
        </form>
        
        <div id="result"></div>
    </div>
    
    <script>
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData();
            fd.append('file', document.getElementById('file').files[0]);
            fd.append('split_method', document.getElementById('splitBy').value);
            fd.append('expression', document.getElementById('expr').value);
            
            try {
                const res = await fetch('/api/convert/pdf-to-video', {method: 'POST', body: fd});
                const data = await res.json();
                
                if(data.success) {
                    document.getElementById('result').innerHTML = `<video controls style="width:100%;"><source src="/api/video/${data.video_file}" type="video/mp4"></video><br><a href="/api/video/${data.video_file}" download>Download Video</a>`;
                } else {
                    const a = document.getElementById('alert');
                    a.className = 'alert error';
                    a.textContent = 'Error: ' + data.error;
                    a.style.display = 'block';
                }
            } catch(e) {
                const a = document.getElementById('alert');
                a.className = 'alert error';
                a.textContent = 'Error: ' + e.message;
                a.style.display = 'block';
            }
        });
    </script>
</body>
</html>

version: '3.8'

services:
  # Flask Web Application - MovieWeave v3.0
  web:
    build: .
    container_name: movieweave-web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./output:/app/output
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backend/assets:/app/backend/assets
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - movieweave-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: movieweave-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - movieweave-network
    command: redis-server --appendonly yes

  # Celery Worker for Async Tasks (Feature 4)
  celery:
    build: .
    container_name: movieweave-celery
    command: celery -A backend.feature4_advanced worker --loglevel=info --concurrency=2
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./output:/app/output
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backend/assets:/app/backend/assets
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - movieweave-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: movieweave-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - movieweave-network

networks:
  movieweave-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  movieweave_data:
    driver: local


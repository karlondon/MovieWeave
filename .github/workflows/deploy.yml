name: Build, Test & Deploy MovieWeave

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: movieweave-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run linting & tests
        run: |
          echo "Running code quality checks..."
          # Add your linting and test commands here
          # pip install -r backend/requirements.txt
          # python -m pytest tests/

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-lightsail:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/movieweave.pem
          chmod 600 ~/.ssh/movieweave.pem
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Lightsail
        run: |
          ssh -i ~/.ssh/movieweave.pem ubuntu@${{ secrets.LIGHTSAIL_INSTANCE_IP }} << 'EOF'
          cd /opt/movieweave
          git pull origin main
          docker-compose pull
          docker-compose up -d
          docker-compose ps
          curl http://localhost:8000/health
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.LIGHTSAIL_INSTANCE_IP }}:8000/health || exit 1
          echo "✅ Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/movieweave.pem

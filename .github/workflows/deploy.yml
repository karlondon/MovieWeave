name: Build, Test & Deploy MovieWeave

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: movieweave-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run linting & tests
        run: |
          echo "Running code quality checks..."

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-lightsail:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/movieweave.pem
          chmod 600 ~/.ssh/movieweave.pem
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_INSTANCE_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Setup and Deploy to Lightsail
        run: |
          ssh -i ~/.ssh/movieweave.pem ubuntu@${{ secrets.LIGHTSAIL_INSTANCE_IP }} << 'SSHEOF'
          set -e
          
          echo "📦 Setting up MovieWeave deployment..."
          
          # Create application directory
          sudo mkdir -p /opt/movieweave
          sudo chown ubuntu:ubuntu /opt/movieweave
          
          # Clone or pull repository
          if [ -d /opt/movieweave/.git ]; then
            echo "Updating existing repository..."
            cd /opt/movieweave
            git pull origin main
          else
            echo "Cloning repository..."
            cd /opt
            git clone https://github.com/karlondon/MovieWeave.git movieweave
            cd /opt/movieweave
          fi
          
          # Ensure config directory exists
          mkdir -p config
          
          # Create .env file with S3 and AWS configuration
          echo "Configuring environment variables..."
          cat > config/.env << 'ENVEOF'
APP_NAME=MovieWeave
DEBUG=false
PORT=8000
HOST=0.0.0.0
AWS_S3_BUCKET=movieweave-storage
AWS_REGION=us-east-1
AWS_S3_ENABLED=true
AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
S3_UPLOAD_DIR=videos/uploads
S3_OUTPUT_DIR=videos/output
S3_BACKUP_DIR=backups
DATABASE_URL=
TOONFLOW_API_KEY=
TOONFLOW_API_URL=
ENVEOF
          
          echo "Environment file created at config/.env"
          
          # Pull latest Docker images
          echo "Pulling Docker images..."
          docker-compose pull || echo "Could not pull images"
          
          # Start services
          echo "Starting services..."
          docker-compose up -d
          
          # Wait for services
          sleep 15
          
          # Verify services
          echo "Verifying deployment..."
          docker-compose ps
          
          # Test API
          echo "Testing API health..."
          for i in {1..10}; do
            if curl -f http://localhost:8000/health 2>/dev/null; then
              echo "API is healthy!"
              break
            fi
            echo "Attempt $i/10 - waiting..."
            sleep 3
          done
          
          SSHEOF

      - name: Verify deployment
        run: |
          sleep 5
          echo "Testing API endpoint..."
          curl -f http://${{ secrets.LIGHTSAIL_INSTANCE_IP }}:8000/health || exit 1
          echo "Deployment successful!"

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/movieweave.pem


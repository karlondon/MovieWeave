user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500M;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Allow resolver to retry with fallback
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    upstream movieweave_api {
        server movieweave-api:8000 max_fails=3 fail_timeout=10s;
    }

    # HTTP server - Redirect to HTTPS and allow Let's Encrypt renewal
    server {
        listen 80;
        listen [::]:80;
        server_name movieweave.myblognow.uk 34.229.168.102;

        # Allow Let's Encrypt ACME challenges for certificate renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server - Main application
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name movieweave.myblognow.uk;

        # SSL Certificate paths (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/movieweave.myblognow.uk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/movieweave.myblognow.uk/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/movieweave.myblognow.uk/chain.pem;

        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Root - Serve React frontend
        location / {
            root /var/www/movieweave;
            try_files $uri $uri/ /index.html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # API routes - proxy to backend
        location ~ ^/(upload|job|jobs|download|health|docs|openapi.json) {
            proxy_pass http://movieweave_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Static assets with long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /var/www/movieweave;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Static files and downloads
        location /data/ {
            alias /var/www/movieweave/data/;
            autoindex off;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Redirect IP address to domain name
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name 34.229.168.102;

        ssl_certificate /etc/letsencrypt/live/movieweave.myblognow.uk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/movieweave.myblognow.uk/privkey.pem;

        return 301 https://movieweave.myblognow.uk$request_uri;
    }
}

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500M;

    upstream movieweave_api {
        server movieweave-api:8000;
    }

    upstream toonflow {
        server toonflow:10588;
    }

    server {
        listen 80;
        server_name movieweave.myblognow.uk 34.204.47.202;

        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name movieweave.myblognow.uk 34.204.47.202;

        ssl_certificate /etc/letsencrypt/live/movieweave.myblognow.uk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/movieweave.myblognow.uk/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # API endpoints
        location /api/ {
            proxy_pass http://movieweave_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location /docs {
            proxy_pass http://movieweave_api/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://movieweave_api/openapi.json;
            proxy_set_header Host $host;
        }

        # Toonflow
        location /toonflow/ {
            proxy_pass http://toonflow/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static files and downloads
        location /data/ {
            alias /var/www/movieweave/data/;
            autoindex off;
        }

        # Health check
        location /health {
            proxy_pass http://movieweave_api/health;
            access_log off;
        }

        # Root redirect
        location / {
            return 404;
        }
    }
}
